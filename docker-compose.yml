services:
  workbench:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                      # .viz.bin files + manifest
      - ./workbench/data:/app/workbench/data  # SQLite DB + event JSONL
      - ./workbench/plugins:/app/workbench/plugins  # Simulator plugins
    environment:
      - WORKERS=3
